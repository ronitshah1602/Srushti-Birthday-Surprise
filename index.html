<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Surprise Awaits You</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffd86b;--bg:#12041f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 100%,#4a0f6b,#12041f 70%);background-color:#12041f;color:#fff;font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
#stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;overflow-y:auto}
h1,h2{color:var(--gold);text-shadow:0 0 18px #ffb300aa;margin:.2em 0}
h2{font-size:clamp(1.6rem,6vw,2.4rem)}
p.sub{opacity:.8;margin:.3em 0 1em}
button{font:800 1rem Nunito;color:var(--gold);background:#2a0d00;border:1px solid #ffb30088;border-radius:99px;padding:12px 26px;cursor:pointer;box-shadow:0 0 16px #ffb30044;margin-top:16px}
button:active{transform:scale(.96)}
.fade{animation:f .8s both}@keyframes f{from{opacity:0;transform:translateY(14px)}}
#gift{font-size:110px;cursor:pointer;animation:b 1.6s infinite;filter:drop-shadow(0 0 20px #ff4fd8)}
@keyframes b{50%{transform:translateY(-12px) rotate(4deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;margin:12px 0}
.stats b{display:block;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--gold);text-shadow:0 0 14px #ffb300}
.stats small{opacity:.6;letter-spacing:2px;font-size:.7rem}
#cake{font-size:90px;cursor:pointer;user-select:none;position:relative}
.flame{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:44px;transition:.4s}
.out .flame{opacity:0;transform:translate(-50%,-20px) scale(.3)}
#balloons{position:relative;width:min(340px,90vw);height:230px}
.bl{position:absolute;font-size:74px;cursor:pointer;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.pop{animation:pp .3s forwards!important}@keyframes pp{to{transform:scale(1.8);opacity:0}}
.wish{min-height:64px;max-width:340px;padding:12px 16px;border:1px solid #ffb30055;border-radius:14px;background:#ffffff0d}
#grid{display:grid;grid-template-columns:repeat(3,84px);gap:10px;margin:14px 0}
.card{height:96px;border-radius:12px;background:linear-gradient(135deg,#ff4fa8,#ff82c8);display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;transition:.3s}
.card.up{background:#1d0a2b;border:1px solid #ffb30055}
.card.done{background:#1d0a2b;opacity:.6}
#sw{position:relative;width:min(300px,86vw);height:150px;border-radius:14px;overflow:hidden;box-shadow:0 0 30px #ff4fd866;touch-action:none}
#sw .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(135deg,#ffe28a,#ffb300);color:#4a2a00;font-weight:800;font-size:1.1rem}
#sw canvas{position:absolute;inset:0;width:100%;height:100%}
#env{font-size:100px;cursor:pointer;animation:b 1.6s infinite}
#letter{width:min(440px,92vw);max-height:62vh;overflow-y:auto;text-align:left;padding:18px 20px;background:#1a0a10cc;border:1px solid #ffb30055;border-radius:14px;box-shadow:0 0 30px #ffb30033;font:700 1.25rem/1.55 'Dancing Script',cursive;color:#ffe9b0;white-space:pre-wrap}
#pol{background:#fff8ec;padding:12px 12px 16px;border-radius:6px;box-shadow:0 0 40px #ffb30066,0 10px 30px #000a;transform:rotate(-2deg);width:min(420px,88vw)}
#pol img{width:100%;display:block;border-radius:3px}
#pol p{margin:10px 0 0;color:#4a2a00;font:700 1.5rem 'Dancing Script',cursive}
#lock{width:min(300px,88vw);padding:26px 20px 22px;border-radius:28px;background:#ffffff10;border:1px solid #ffffff22;box-shadow:0 0 50px #b388ff44;backdrop-filter:blur(8px)}
#lock .clk{font-size:2.8rem;font-weight:800;letter-spacing:2px;color:#ffffffcc}
#lock .ttl{font-size:.8rem;opacity:.6;margin-bottom:14px}
#dots{display:flex;justify-content:center;gap:14px;margin:12px 0 18px}
#dots i{width:14px;height:14px;border-radius:50%;border:2px solid #ffffff88}
#dots i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
#pad button{width:64px;height:64px;padding:0;margin:0;font-size:1.5rem;color:#fff;background:#ffffff14;border:1px solid #ffffff22;box-shadow:none}
#pad button:active{background:#ffffff33}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style></head>

const $=s=>document.querySelector(s), st=$('#stage');
const show=h=>{st.innerHTML='<div class="fade">'+h+'</div>'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* confetti background */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
const cols=['#ffd86b','#ff4fa8','#7cf','#b388ff','#fff'];
function mk(x,y,burst){return{x:x??Math.random()*cv.width,y:y??-10,vx:burst?(Math.random()-.5)*12:(Math.random()-.5)*.6,vy:burst?-Math.random()*10-3:Math.random()*1.2+.4,r:Math.random()*3+2,c:cols[Math.random()*5|0],a:Math.random()*6}}
for(let i=0;i<60;i++){const p=mk();p.y=Math.random()*cv.height;P.push(p)}
function burst(n=90){for(let i=0;i<n;i++)P.push(mk(cv.width/2,cv.height/2,true))}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.vy<1.4?.05:0;p.a+=.1;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();
  if(p.y>cv.height+10){p.y=-10;p.x=Math.random()*cv.width;p.vx=(Math.random()-.5)*.6;p.vy=Math.random()*1.2+.4}});
 requestAnimationFrame(loop)})();

/* 0. PIN lock */
function lock(){
 const t=new Date(),hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
 show(`<div id="lock"><div class="clk">${hh}</div><div class="ttl">Birthday Surprise 🎁</div><div style="font-size:1.6rem">🔒</div>
 <p class="sub" id="lm" style="margin:6px 0 0">Enter the password</p><div id="dots">${CONFIG.pin.split("").map(()=>"<i></i>").join("")}</div>
 <div id="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div></div>`);
 let v='';
 const draw=()=>document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
 function key(k){
  if(!$('#lock'))return;
  if(k==='⌫'){v=v.slice(0,-1);draw();return}
  if(v.length>=CONFIG.pin.length)return;
  v+=k;draw();
  if(v.length===CONFIG.pin.length){
   if(v===CONFIG.pin){$('#lm').textContent='Welcome! Opening…';document.removeEventListener('keydown',kd);burst(80);setTimeout(gift,900)}
   else{$('#lm').textContent='Wrong password, try again';$('#dots').classList.add('shake');setTimeout(()=>{v='';draw();$('#dots').classList.remove('shake')},450)}
  }
 }
 const kd=e=>{if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫')};
 document.addEventListener('keydown',kd);
 document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
/* 1. gift */
function gift(){
 show(`<h2>A surprise awaits you… ✨</h2><p class="sub">Something special, just for you</p><div id="gift">🎁</div><p class="sub">Tap the gift to open</p>`);
 $('#gift').onclick=()=>{burst(160);intro()};
}
/* 2. intro */
function intro(){
 show(`<div style="font-size:64px">🧸</div><h2>${CONFIG.introTitle}</h2><p class="sub" style="max-width:420px">“${CONFIG.intro}”</p><button id="n">Continue ➜</button>`);
 $('#n').onclick=cake;
}
/* 3. cake */
function cake(){
 const b=new Date(CONFIG.birthDate+"T"+CONFIG.birthTime+":00"),n=new Date(),ms=n-b,d=Math.floor(ms/864e5);
 let age=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate(),b.getHours(),b.getMinutes()))age--;
 const f=x=>x.toLocaleString();
 show(`<h2>Happy Birthday ${CONFIG.name} 🎂</h2><p class="sub">The world has been better since ✨</p>
 <div class="stats"><div><b>${age}</b><small>YEARS</small></div><div><b>${f(d)}</b><small>DAYS</small></div><div><b id="sh">${f(Math.floor(ms/36e5))}</b><small>HOURS</small></div><div><b id="sm">${f(Math.floor(ms/6e4))}</b><small>MINUTES</small></div></div>
 <div id="cake">🎂<span class="flame">🔥</span></div><p class="sub" id="hint">Tap the cake to blow out the candles</p>`);
 const tick=setInterval(()=>{if(!$('#sm')){clearInterval(tick);return}const m=new Date()-b;$('#sh').textContent=f(Math.floor(m/36e5));$('#sm').textContent=f(Math.floor(m/6e4))},1000);
 $('#cake').onclick=()=>{ if($('#cake').classList.contains('out'))return;
  $('#cake').classList.add('out');burst(120);
  $('#hint').innerHTML='Make a wish… ✨<br><button id="n">Next Surprise 🎈</button>';$('#n').onclick=balloons};
}
/* 4. balloons */
function balloons(){
 show(`<h2>Pop the Wishes 🎈</h2><p class="sub">Tap each balloon to reveal a little wish</p><div id="balloons"></div><div class="wish" id="w">…</div><p class="sub" id="c"></p>`);
 const B=$('#balloons'),em=['🎈','🎈','🎈','🎈','🎈','🎈'],hue=[0,200,120,280,40,330];let popped=0;
 CONFIG.wishes.slice(0,6).forEach((w,i)=>{const e=document.createElement('div');e.className='bl';e.textContent='🎈';
  e.style.left=(i%3)*33+'%';e.style.top=(i<3?0:105)+'px';e.style.filter=`hue-rotate(${hue[i]}deg)`;e.style.animationDelay=i*.3+'s';
  e.onclick=()=>{if(e.dataset.d)return;e.dataset.d=1;e.classList.add('pop');popped++;$('#w').textContent=w;
   $('#c').innerHTML=popped<CONFIG.wishes.slice(0,6).length?`Popped ${popped}/${CONFIG.wishes.slice(0,6).length}`:'<button id="n">Continue ✨</button>';
   if($('#n'))$('#n').onclick=memory};B.appendChild(e)});
}
/* 5. memory match */
function memory(){
 show(`<h2>Memory Match 💗</h2><p class="sub">Find all the matching pairs</p><div id="grid"></div><p class="sub" id="m">0 moves</p>`);
 const sy=['✨','🎉','🎂'];let deck=[...sy,...sy].sort(()=>Math.random()-.5),first=null,lock=false,mv=0,pairs=0;
 deck.forEach(s=>{const c=document.createElement('div');c.className='card';c.textContent='🎀';
  c.onclick=()=>{if(lock||c.classList.contains('up')||c.classList.contains('done'))return;
   c.classList.add('up');c.textContent=s;
   if(!first){first=c;return}
   mv++;$('#m').textContent=mv+' moves';
   if(first.textContent===s){first.classList.add('done');c.classList.add('done');first=null;
    if(++pairs===3){$('#m').innerHTML='All matched! 🎉<br><button id="n">One Last Surprise ✨</button>';burst(100);$('#n').onclick=scratch}}
   else{lock=true;const a=first;first=null;setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove('up');x.textContent='🎀'});lock=false},700)}};
  $('#grid').appendChild(c)});
}
/* 6. scratch card */
function scratch(){
 show(`<h2>One Last Surprise ✨</h2><p class="sub">Scratch the golden card to reveal it</p>
 <div id="sw"><div class="under">${CONFIG.scratch}</div><canvas></canvas></div><div id="nx"></div>`);
 const c=$('#sw canvas'),r=c.getBoundingClientRect();c.width=r.width;c.height=r.height;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#ff4fd8');g.addColorStop(1,'#7a3cff');
 x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='800 22px Nunito';x.textAlign='center';x.fillText('Scratch Me ✨',c.width/2,c.height/2+6);
 let down=false,done=false;x.globalCompositeOperation='destination-out';
 const sc=e=>{if(!down||done)return;const q=c.getBoundingClientRect();x.beginPath();x.arc(e.clientX-q.left,e.clientY-q.top,20,0,7);x.fill();check()};
 function check(){const d=x.getImageData(0,0,c.width,c.height).data;let t=0;for(let i=3;i<d.length;i+=16)if(!d[i])t++;
  if(t/(d.length/16)>.45){done=true;c.style.opacity=0;c.style.transition='.6s';burst(120);setTimeout(photo,900)}}
 c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);sc(e)};c.onpointermove=sc;c.onpointerup=()=>down=false;
}
/* 6b. photo reveal */
function photo(){
 show(`<h2>Surprise! 📸</h2><div id="pol"><img src="${CONFIG.photo}" alt=""><p>${CONFIG.photoCaption}</p></div><button id="n">Open your letter 💌</button>`);
 burst(160);$('#n').onclick=letter;
}
/* 7. letter */
async function letter(){
 show(`<div id="env">💌</div><h2>A Letter Just For You</h2><p class="sub">Tap to open</p>`);
 $('#env').onclick=async()=>{
  show(`<h2>A Letter Just For You</h2><div id="letter"></div><p id="end"></p>`);
  const L=$('#letter'),t=CONFIG.letterTitle+'\n\n'+CONFIG.letter;
  for(let i=0;i<t.length;i++){L.textContent=t.slice(0,i+1);L.scrollTop=L.scrollHeight;await wait(28)}
  $('#end').innerHTML=`<h2 style="font-family:'Dancing Script'">${CONFIG.closing}</h2><button id="n">↻ Watch it again</button>`;burst(150);$('#n').onclick=gift;
 };
}
lock();
</script>
</body></html>
